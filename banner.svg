<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taariq Solanki - Generative AI and Agentic AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161b2e"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9900"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#6E40C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#6E40C9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E40C9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- subtle circuit grid on the right -->
  <g stroke="#A371F7" stroke-opacity="0.14" stroke-width="1.5">
    <path d="M760 70 H1120 M760 130 H1120 M760 190 H1120 M760 250 H1120"/>
    <path d="M820 40 V290 M900 40 V290 M980 40 V290 M1060 40 V290"/>
  </g>

  <!-- neural / agent nodes -->
  <g>
    <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55">
      <line x1="900" y1="90" x2="1000" y2="160"/>
      <line x1="900" y1="90" x2="1000" y2="230"/>
      <line x1="900" y1="230" x2="1000" y2="160"/>
      <line x1="900" y1="230" x2="1000" y2="230"/>
      <line x1="1000" y1="160" x2="1095" y2="120"/>
      <line x1="1000" y1="160" x2="1095" y2="200"/>
      <line x1="1000" y1="230" x2="1095" y2="200"/>
    </g>
    <g>
      <circle cx="900" cy="90" r="10" fill="#FF9900"/>
      <circle cx="900" cy="230" r="10" fill="#A371F7"/>
      <circle cx="1000" cy="160" r="12" fill="#6E40C9"/>
      <circle cx="1000" cy="230" r="9" fill="#A371F7"/>
      <circle cx="1095" cy="120" r="8" fill="#FF9900"/>
      <circle cx="1095" cy="200" r="8" fill="#6E40C9"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.85" filter="url(#soft)">
      <circle cx="900" cy="90" r="3"/>
      <circle cx="1000" cy="160" r="3.5"/>
      <circle cx="900" cy="230" r="3"/>
    </g>
  </g>

  <!-- left accent bar -->
  <rect x="56" y="96" width="6" height="128" rx="3" fill="url(#accent)"/>

  <!-- text -->
  <text x="84" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Taariq Solanki</text>
  <text x="86" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">Generative AI &amp; Agentic AI Engineer</text>
  <text x="86" y="214" font-family="'Consolas', 'SFMono-Regular', monospace" font-size="16" fill="#8b97b5">Amazon Bedrock · RAG · Agents · AgentCore · Serverless AWS</text>

  <!-- small tags -->
  <g font-family="'Consolas', monospace" font-size="13" font-weight="600">
    <g>
      <rect x="86" y="238" width="78" height="26" rx="13" fill="#FF9900" fill-opacity="0.15" stroke="#FF9900" stroke-opacity="0.5"/>
      <text x="99" y="255" fill="#FF9900">Bedrock</text>
    </g>
    <g>
      <rect x="174" y="238" width="54" height="26" rx="13" fill="#A371F7" fill-opacity="0.15" stroke="#A371F7" stroke-opacity="0.5"/>
      <text x="186" y="255" fill="#A371F7">LLMs</text>
    </g>
    <g>
      <rect x="238" y="238" width="52" height="26" rx="13" fill="#6E40C9" fill-opacity="0.18" stroke="#6E40C9" stroke-opacity="0.6"/>
      <text x="250" y="255" fill="#b89bff">RAG</text>
    </g>
    <g>
      <rect x="300" y="238" width="74" height="26" rx="13" fill="#00A67E" fill-opacity="0.15" stroke="#00A67E" stroke-opacity="0.5"/>
      <text x="312" y="255" fill="#2fd4ac">Agents</text>
    </g>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#A371F7" stroke-opacity="0.25" stroke-width="2"/>
</svg>
